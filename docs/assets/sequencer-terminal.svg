  <title id="title">Sequencer output</title>
  <desc id="desc">Log of client/opcua_sequencer.py running one cycle of the SecondOp group against a simulated cell: each step turns its trigger on, waits for the feedback signal, turns the trigger off and waits for the reset.</desc>
